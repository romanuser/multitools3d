<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criador 3D — Multiferramenta 3D</title>
<style>
:root{--bg:#0f0b1a;--sf:#17112a;--sf2:#1f1836;--line:#2c2347;--ink:#f3f0fb;--mut:#a59cc2;--ac:#7c3aed;--ac2:#a78bfa;--bad:#f87171;--good:#4ade80}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:360px 1fr;height:100%;min-height:600px}
aside{border-right:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.modelos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modelo{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;color:var(--ink);cursor:pointer}
.modelo b{display:block;font-size:13px}.modelo small{color:var(--mut);font-size:11px}
.modelo[aria-pressed=true]{border-color:var(--ac);background:#251a44}
.modelo .ic{font-size:20px}
h1{font-size:18px;margin:0}h2{font-size:13px;color:var(--mut);margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.campo{display:flex;flex-direction:column;gap:4px}.campo label{font-size:12px;color:var(--mut)}
.campo small{color:var(--mut);font-size:11px}
input,select{background:var(--sf2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;width:100%}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
.linha{display:flex;gap:8px;align-items:center}.linha input[type=range]{flex:1;padding:0;accent-color:var(--ac)}.linha input[type=number]{width:84px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}.chk input{width:auto;accent-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:999px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:15px;width:100%}
.btn:disabled{opacity:.5;cursor:wait}.btn2{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn2:hover{border-color:var(--ac2)}
main{position:relative;display:flex;flex-direction:column;min-width:0}
#view{flex:1;min-height:360px;position:relative}#view canvas{display:block;width:100%;height:100%}
.status{position:absolute;left:16px;top:14px;background:rgba(15,11,26,.8);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--mut)}
.status.erro{color:var(--bad);border-color:var(--bad)}
.barra{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--sf)}
.parte{display:flex;align-items:center;gap:6px;background:var(--sf2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:12px}
.parte input[type=color]{width:26px;height:26px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.parte button{background:none;border:0;color:var(--ac2);cursor:pointer;font-size:12px;padding:0 0 0 4px}
.dicas{font-size:12px;color:var(--mut);margin:0;padding-left:18px}.dicas li{margin:3px 0}
.esp{flex:1}
@media (max-width:860px){.app{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}#view{height:62vh}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div><h1>Criador 3D</h1><small style="color:var(--mut)">Escolha um modelo, personalize e baixe pronto pra fatiar.</small></div>
    <div class="modelos" id="modelos"></div>
    <h2 id="titulo-campos">Personalizar</h2>
    <form id="form" class="campos" style="display:flex;flex-direction:column;gap:12px" onsubmit="return false"></form>
    <button class="btn" id="gerar" type="button">Gerar modelo</button>
    <ul class="dicas" id="dicas"></ul>
    <small style="color:var(--mut);font-size:11px">Gerado no seu navegador com OpenSCAD (GPL) · fontes Google Fonts (OFL). <a href="LICENCAS.txt" target="_blank" style="color:var(--ac2)">Licenças</a></small>
  </aside>
  <main>
    <div id="view"><div class="status" id="status">Carregando o motor 3D…</div></div>
    <div class="barra" id="barra"></div>
  </main>
</div>
<script src="vendor/qrcode.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
